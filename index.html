<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Simulateur budgétaire citoyen : comprendre l'effet mécanique des leviers fiscaux et de dépense publique."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f4fa3'/%3E%3Cpath d='M8 22V12h4v10zm6 0V8h4v14zm6 0v-7h4v7z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <title>Mon budget pour la France</title>
    <script>
      // Applies the stored style and mode before the first paint (see src/ui/state/theme.ts).
      (function () {
        var root = document.documentElement;
        var get = function (key) {
          try {
            return localStorage.getItem(key);
          } catch (e) {
            return null;
          }
        };
        var style = get('style');
        if (['prestige', 'populaire', 'neon'].indexOf(style) < 0) style = 'gazette';
        var mode = get('theme');
        if (mode !== 'light' && mode !== 'dark') {
          mode =
            style === 'prestige' ||
            style === 'neon' ||
            (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
              ? 'dark'
              : 'light';
        }
        root.dataset.style = style;
        root.dataset.theme = mode;
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p>Ce simulateur fonctionne entièrement dans votre navigateur et nécessite JavaScript.</p>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
